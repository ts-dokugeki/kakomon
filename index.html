<style>

度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問80：中毒時に用いられる解毒剤または拮抗剤の組み合わせとして、正しいものを一つ選びなさい。","A":"シアン酸ナトリウム－硫酸アトロピン","B":"N-メチル-1-ナフチルカルバメート（別名カルバリル）－ジメルカプロール（別名BAL）","C":"2-イソプロピル-4-メチルピリミジル-6-ジエチルチオホスフェイト（別名ダイアジノン）－2-ピリジルアルドキシムメチオダイド（別名PAM）","D":"","E":"","answer":"C","explanation":"","source":"令和7年度/農業用品目/問80"},{"number":1,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問1：法第3条の条文に関する以下の記述の正誤について、正しい組み合わせを一つ選びなさい。\n\nア：毒物又は劇物の製造業の登録を受けた者は、毒物又は劇物を販売又は授与の目的で製造することができる。\nイ：毒物又は劇物の輸出業の登録を受けた者は、毒物又は劇物を販売又は授与の目的で輸出することができる。\nウ：毒物又は劇物の輸入業の登録を受けた者は、毒物又は劇物を販売又は授与の目的で輸入することができる。\nエ：毒物又は劇物の販売業の登録を受けた者は、毒物又は劇物を販売又は授与の目的で貯蔵することができる。","A":"ア 正／イ 誤／ウ 正／エ 誤","B":"ア 正／イ 誤／ウ 正／エ 正","C":"ア 正／イ 正／ウ 正／エ 正","D":"ア 誤／イ 正／ウ 誤／エ 誤","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問1"},{"number":2,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問2：以下の物質を含有する製剤と法第3条の2第5項の規定により品目ごとに政令で定められている用途に関する組み合わせのうち、誤っているものを一つ選びなさい。","A":"四アルキル鉛 ― ガソリンへの混入","B":"モノフルオール酢酸の塩類 ― 野ねずみの駆除","C":"ジメチルエチルメルカプトエチルチオホスフエイト ― かんきつ類などの害虫の防除","D":"モノフルオール酢酸アミド ― 野ねずみの駆除","E":"","answer":"D","explanation":"","source":"令和6年度/農業用品目/問2"},{"number":3,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問3：法第3条の4に規定されている引火性、発火性又は爆発性のある毒物又は劇物であって政令で定めるものとして、正しいものを一つ選びなさい。","A":"硫酸","B":"ナトリウム","C":"ニトログリセリン","D":"過酸化水素","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問3"},{"number":4,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問4：営業の登録に関する以下の記述のうち、正しいものを一つ選びなさい。","A":"毒物又は劇物の輸入業の登録は、6年ごとに更新を受けなければ、その効力を失う。","B":"毒物又は劇物の販売業の登録は、一般販売業、農業用品目販売業、特定毒物販売業の登録に分けられる。","C":"一般販売業の登録を受けた者は、全ての毒物及び劇物を販売することができる。","D":"","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問4"},{"number":5,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問5：法第6条に規定されている毒物又は劇物の販売業の登録事項として、誤っているものを一つ選びなさい。","A":"申請者の氏名及び住所（法人にあっては、その名称及び主たる事務所の所在地）","B":"販売しようとする毒物又は劇物の品目","C":"店舗の所在地","D":"","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問5"},{"number":6,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問6：毒物劇物取扱責任者に関する以下の記述のうち、正しいものを一つ選びなさい。","A":"毒物劇物営業者は、自ら毒物劇物取扱責任者となることができない。","B":"毒物劇物営業者は、毒物劇物取扱責任者を変更したときは、30日以内に、その毒物劇物取扱責任者の氏名を届け出なければならない。","C":"20歳未満の者は、毒物劇物取扱責任者となることができない。","D":"","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問6"},{"number":7,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問7：法第10条に規定されている毒物劇物営業者がその旨を届け出なければならない場合として、誤っているものを一つ選びなさい。","A":"製造所、営業所又は店舗の名称を変更したとき","B":"毒物又は劇物を製造し、貯蔵し、又は運搬する設備の重要な部分を変更したとき","C":"毒物又は劇物の購入元を変更したとき","D":"製造所、営業所又は店舗における営業を廃止したとき","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問7"},{"number":8,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問8：以下の法の条文について、（）の中に入れるべき字句の正しい組み合わせを一つ選びなさい。第11条第4項（ア）及び特定毒物研究者は、毒物又は厚生労働省令で定める劇物については、その容器として、（イ）の容器として通常使用される物を使用してはならない。","A":"ア 特定毒物使用者／イ 飲食物","B":"ア 特定毒物使用者／イ 化粧品","C":"ア 毒物劇物営業者／イ 飲食物","D":"ア 毒物劇物営業者／イ 化粧品","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問8"},{"number":9,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問9：法第13条に規定されている特定の用途に供される毒物又は劇物の販売等に関する記述のうち、正しいものを一つ選びなさい。","A":"毒物劇物営業者は、硫酸タリウムを含有する製剤たる劇物については、あせにくい黒色で着色する方法により着色したものでなければ、これを工業用として販売し、又は授与してはならない。","B":"毒物劇物営業者は、硫酸タリウムを含有する製剤たる劇物については、あせにくい青色で着色する方法により着色したものでなければ、これを農業用として販売し、又は授与してはならない。","C":"毒物劇物営業者は、硫酸タリウムを含有する製剤たる劇物については、あせにくい黒色で着色する方法により着色したものでなければ、これを農業用として販売し、又は授与してはならない。","D":"","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問9"},{"number":10,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問10：法第14条に規定されている毒物劇物営業者が毒物又は劇物を毒物劇物営業者以外の者に販売するときに、当該譲受人から提出を受けなければならない書面に必要な事項の正誤について、正しい組み合わせを一つ選びなさい。\n\nア：毒物又は劇物の名称及び数量の記載\nイ：販売した年月日の記載\nウ：毒物又は劇物の使用期限の記載\nエ：譲受人の押印","A":"ア 誤／イ 正／ウ 正／エ 誤","B":"ア 正／イ 正／ウ 誤／エ 誤","C":"ア 正／イ 誤／ウ 正／エ 正","D":"ア 正／イ 正／ウ 誤／エ 正","E":"","answer":"D","explanation":"","source":"令和6年度/農業用品目/問10"},{"number":11,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問11：法第15条の条文に関する以下の記述の正誤について、正しい組み合わせを一つ選びなさい。\n\nア：毒物劇物営業者は、20歳未満の者に毒物又は劇物を交付してはならない。\nイ：毒物劇物営業者は、麻薬、大麻、あへん又は覚せい剤の中毒者に毒物又は劇物を交付してはならない。\nウ：毒物劇物営業者は、交付を受ける者の氏名及び住所を確認した後でなければ、法第3条の4に規定する引火性、発火性又は爆発性のある毒物又は劇物であって政令で定めるものを交付してはならない。\nエ：毒物劇物営業者は、帳簿を備え、最終の記載をした日から5年間、保存しなければならない。","A":"ア 正／イ 誤／ウ 誤／エ 正","B":"ア 誤／イ 正／ウ 正／エ 正","C":"ア 正／イ 誤／ウ 正／エ 誤","D":"ア 誤／イ 正／ウ 誤／エ 誤","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問11"},{"number":12,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問12：法第15条の2に規定されている毒物又は劇物の廃棄の方法に関する以下の記述のうち、誤っているものを一つ選びなさい。","A":"中和、加水分解、酸化、還元、稀釈その他の方法により、毒物及び劇物並びに法第11条第2項に規定する政令で定める物のいずれにも該当しない物とすること。","B":"揮発性の毒物又は劇物は、保健衛生上危害を生ずるおそれがない場所で、少量ずつ揮発させること。","C":"可燃性の毒物又は劇物は、保健衛生上危害を生ずるおそれがない場所で、少量ずつ放出させること。","D":"","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問12"},{"number":13,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問13：以下の法の条文について、（）の中に入れるべき字句の正しい組み合わせを一つ選びなさい。\n\n第17条第1項　毒物劇物営業者及び特定毒物研究者は、その取扱いに係る毒物若しくは劇物又は第11条第2項の政令で定める物が飛散し、漏れ、流れ出し、染み出し、又は地下に染み込んだ場合において、不特定又は多数の者について（ア）の危害が生ずるおそれがあるときは、（イ）、その旨を保健所、警察署（ウ）に届け出るとともに、（ア）の危害を防止するために必要な応急の措置を講じなければならない。","A":"ア 環境衛生上／イ 24時間以内に／ウ 又は消防機関","B":"ア 保健衛生上 ／イ 24時間以内に／ウ 及び医療機関","C":"ア 環境衛生上／イ 直ちに／ウ 及び医療機関","D":"ア 保健衛生上／イ 直ちに／ウ 又は消防機関","E":"","answer":"D","explanation":"","source":"令和6年度/農業用品目/問13"},{"number":14,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問14：特定毒物研究者に関する以下の記述の正誤について、正しい組み合わせを一つ選びなさい。ア特定毒物研究者の許可を受けようとする者は、厚生労働大臣に申請書を出さなければならない。イ特定毒物研究者は、学術研究のために使用した特定毒物の品名及び数量を毎年届け出なければならない。ウ特定毒物研究者は、その許可が効力を失ったときは、15日以内に、現に所有する特定毒物の品名及び数量を届け出なければならない。エ特定毒物研究者は、その許可が効力を失った日から起算して50日以内は、現に所有する特定毒物を他の特定毒物研究者へ譲り渡すことができる。アイウエ","A":"ア 正／イ 誤／ウ 誤／エ 誤","B":"ア 正／イ 正／ウ 誤／エ 正","C":"ア 誤／イ 正／ウ 正／エ 誤","D":"ア 誤／イ 誤／ウ 正／エ 正","E":"","answer":"D","explanation":"","source":"令和6年度/農業用品目/問14"},{"number":15,"year":"令和6年度","category":"毒物及び劇物に関する法規","question":"問15：法第22条第1項に規定されている業務上取扱者の届出が必要な事業であって政令で定められているものとして、誤っているものを一つ選びなさい。","A":"無機シアン化合物たる毒物及びこれを含有する製剤を用いて、電気めっきを行う事業","B":"無機シアン化合物たる毒物及びこれを含有する製剤を用いて、金属熱処理を行う事業","C":"最大積載量が500キログラム以上の自動車に固定された容器を用いて、ニトロベンゼンの運送を行う事業","D":"砒素化合物たる毒物及びこれを含有する製剤を用いて、しろありの防除を行う tion":"問46：物質Aが液体Bに溶けて均一に混ざり合った液体について、溶かす液体Bを何というか。","A":"溶液","B":"溶媒","C":"溶質","D":"飽和溶液","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問46"},{"number":47,"year":"令和6年度","category":"基礎化学","question":"問47：電気分解に関する以下の記述のうち、誤っているものを一つ選びなさい。","A":"電源の正極につないだ電極を陽極、負極につないだ電極を陰極という。","B":"陽極では酸化反応が、陰極では還元反応が起こる。","C":"水素よりイオン化傾向の大きい金属の陽イオンは電子を受け取って還元され、金属が析出する。","D":"水酸化ナトリウム水溶液を電気分解すると、陰極では水素が発生し、陽極では酸素が発生する。","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問47"},{"number":48,"year":"令和6年度","category":"基礎化学","question":"問48：アルデヒドやケトンに関する以下の記述のうち、誤っているものを一つ選びなさい。","A":"一般式Ｒ－ＣＨＯ（Ｒは炭化水素基）で表される化合物をケトンという。","B":"アセトンにヨウ素と水酸化ナトリウム水溶液を加えて反応させると、ヨードホルムが生じる。","C":"アルデヒドは第一級アルコールを酸化して得られる。","D":"アセトアルデヒドは刺激臭のある無色の液体で水によく溶ける。","E":"","answer":"A","explanation":"","source":"令和6年度/農業用品目/問48"},{"number":49,"year":"令和6年度","category":"基礎化学","question":"問49：以下の化学反応式の（）の中に入る数字の組み合わせとして、正しいものを一つ選びなさい。\n\n2ＣＨ3ＯＨ＋（ア）Ｏ2→（イ）ＣＯ2＋（ウ）Ｈ2Ｏアイウ","A":"ア 3／イ 2／ウ 2","B":"ア 3／イ 2／ウ 4","C":"ア 6／イ 3／ウ 2","D":"ア 6／イ 3／ウ 4","E":"","answer":"B","explanation":"","source":"令和6年度/農業用品目/問49"},{"number":50,"year":"令和6年度","category":"基礎化学","question":"問50：物質を分離する操作に関する以下の記述のうち、誤っているものを一つ選びなさい。","A":"沸点の差を利用して、液体の混合物から成分を分離する操作を分留という。","B":"固体と液体の混合物から、ろ紙などを用いて固体を分離する操作をろ過という。","C":"不純物を含む固体を溶媒に溶かし、温度によって溶解度が異なることを利用して、より純粋な物質を析出させ分離する操作を抽出という。","D":"固体の混合物を加熱して、固体から直接気体になる成分を冷却して分離する操作を昇華法（昇華）という。","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問50"},{"number":51,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問51：以下の物質を含有する製剤と、それらが劇物の指定から除外されるものに関する組み合わせのうち、正しいものを一つ選びなさい。","A":"1・1’－イミノジ（オクタメチレン）ジグアニジン（別名 イミノクタジン） － 5％以下を含有するもの","B":"エチルジフエニルジチオホスフエイト（別名 エジフェンホス） － 3％以下を含有するもの","C":"硫酸タリウム － 0.3％以下を含有し、黒色に着色され、かつ、トウガラシエキスを用いて著しくからく着味され ているもの","D":"","E":"","answer":"C","explanation":"","source":"令和6年度/農業用品目/問51"},{"number":52,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問52：以下の記述に該当する物質として、最も適当なものを下欄の1～3の中から一つ選びなさい。\n\nメルカプタン臭のある淡黄色透明液体で、水に極めて溶けにくく、有機溶媒に溶けやすい。野菜等のネコブセンチュウを防除する農薬として用いられる。","A":"Ｏ－エチル＝Ｓ・Ｓ－ジプロピル＝ホスホロジチオアート（別名 エトプロホス）","B":"エチル＝2－ジエトキシチオホスホリルオキシ－5－メチルピラゾロ〔1・5－ ａ〕ピリミジン－6－カルボキシラート（別名 ピラゾホス）","C":"アバメクチン","D":"","E":"","answer":"A","explanation":"","source":"令和6年度/農業用品目/問52"},{"number":53,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問53：以下の物質とその性状に関する組み合わせのうち、正しいものを一つ選びなさい。","A":"ニコチン － 無色、無臭の油状液体であるが、空気中では速やかに褐変する。","B":"ジメチル－4－メチルメルカプト－3－メチルフェニルチオホスフェイト（別名 フェンチオン）－ 無色の液体で、アルコールその他の非極性溶媒に可溶である。水中では徐々に分解する。","C":"ジメチル－2・2－ジクロルビニルホスフェイト（別名 DDVP）－ 淡褐色の弱いニンニク様の臭気がある液体で、有機溶媒には溶けるが水にはほとんど溶けない。","D":"","E":"","answer":"A","explanation":"","source":"令和6年度/農業用品目/問53"},{"number":54,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問54：ロテノンの性状として、最も適当なものを選びなさい。","A":"純品は白色、針状の結晶であり、水及び氷酢酸にやや可溶、その他の有機溶媒には難溶である。","B":"斜方六面体結晶であり、クロロホルムに易溶、水には難溶である。","C":"赤褐色油状物であり、アルコール、エーテル、アセトン及びベンゼンに可溶、水には不溶である。","D":"無色、無臭、透明な油状液体で腐食性が大である。","E":"硫黄臭のある淡黄色液体であり、有機溶媒に可溶、水に難溶である。","answer":"B","explanation":"","source":"令和6年度/農業用品目/問54"},{"number":55,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問55：ジメチルジチオホスホリルフェニル酢酸エチル（別名フェントエート）の性状として、最も適当なものを選びなさい。","A":"純品は白色、針状の結晶であり、水及び氷酢酸にやや可溶、その他の有機溶媒には難溶である。","B":"斜方六面体結晶であり、クロロホルムに易溶、水には難溶である。","C":"赤褐色油状物であり、アルコール、エーテル、アセトン及びベンゼンに可溶、水には不溶である。","D":"無色、無臭、透明な油状液体で腐食性が大である。","E":"硫黄臭のある淡黄色液体であり、有機溶媒に可溶、水に難溶である。","answer":"C","explanation":"","source":"令和6年度/農業用品目/問55"},{"number":56,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問56：ブラストサイジンSの性状として、最も適当なものを選びなさい。","A":"純品は白色、針状の結晶であり、水及び氷酢酸にやや可溶、その他の有機溶媒には難溶である。","B":"斜方六面体結晶であり、クロロホルムに易溶、水には難溶である。","C":"赤褐色油状物であり、アルコール、エーテル、アセトン及びベンゼンに可溶、水には不溶である。","D":"無色、無臭、透明な油状液体で腐食性が大である。","E":"硫黄臭のある淡黄色液体であり、有機溶媒に可溶、水に難溶である。","answer":"A","explanation":"","source":"令和6年度/農業用品目/問56"},{"number":57,"year":"令和6年度","category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法","question":"問57：硫酸の性状として、最も適当なものを選びなさい。","A":"純品は白色、針状の結晶であり、水及び氷酢酸にやや可溶、その他の有機溶媒には難溶である。","B":"斜方六面体結晶であり、クロロホルムに易溶、水には難溶である。","C":"赤褐色油状物であり let questions=[...builtInQuestions], session=[], idx=0, correct=0, answered=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function refreshCategories(){const sel=$("category"), old=sel.value; const cats=[...new Set(questions.map(q=>q.category||"その他"))].sort();sel.innerHTML='<option value="all">すべての分野</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");if(cats.includes(old))sel.value=old;}
function start(){let pool=questions.filter(q=>$("category").value==="all"||q.category===$("category").value);if(!pool.length){alert("この分野には問題がありません。");return;}pool=[...pool].sort(()=>Math.random()-.5);const n=$("count").value==="all"?pool.length:Math.min(Number($("count").value),pool.length);session=pool.slice(0,n);idx=0;correct=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");renderQuestion();$("quiz").scrollIntoView({behavior:"smooth",block:"start"});}
function renderQuestion(){answered=false;const q=session[idx];$("position").textContent=`出題 ${idx+1} / ${session.length}`;$("sourceTag").textContent=`${q.year}・問${q.number}`;$("categoryTag").textContent=q.category;$("bar").style.width=`${idx/session.length*100}%`;$("question").textContent=q.question;$("choices").innerHTML="";$("feedback").className="feedback hidden";$("feedback").innerHTML="";$("next").disabled=true;$("next").textContent=idx===session.length-1?"結果を見る":"次の問題へ";["A","B","C","D","E"].filter(k=>String(q[k]??"").trim()!=="").forEach(k=>{const b=document.createElement("button");b.className="choice";b.dataset.key=k;b.innerHTML=`<span class="letter">${k}</span><span>${esc(q[k])}</span>`;b.addEventListener("click",()=>answer(k));$("choices").appendChild(b);});}
function answer(k){if(answered)return;answered=true;const q=session[idx],ok=k===q.answer;if(ok)correct++;[...$("choices").children].forEach(b=>{b.disabled=true;const key=b.dataset.key;if(key===q.answer)b.classList.add("correct");if(key===k&&!ok)b.classList.add("wrong");});const fb=$("feedback");fb.className="feedback "+(ok?"good":"bad");fb.innerHTML=`<strong>${ok?"正解です！":"不正解です"}</strong><div>正解：${q.answer}　${esc(q[q.answer])}</div><p style="margin:8px 0 0">${esc(q.explanation||"解説は登録されていません。")}</p>`;$("next").disabled=false;$("bar").style.width=`${(idx+1)/session.length*100}%`;}
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${correct} / ${session.length} 問`;$("percent").textContent=`正答率：${Math.round(correct/session.length*100)}%`;$("resultText").textContent="この試作版では学習履歴を保存しません。";$("result").scrollIntoView({behavior:"smooth",block:"start"});}
$("start").addEventListener("click",start);$("next").addEventListener("click",()=>{if(!answered)return;if(idx<session.length-1){idx++;renderQuestion();}else finish();});$("quit").addEventListener("click",()=>{$("quiz").classList.add("hidden");});$("again").addEventListener("click",start);
refreshCategories();
</script>
