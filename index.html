<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5b46">
<title>毒劇物 試験練習</title>
<style>
:root{--green:#1f5b46;--pale:#eef6f1;--ink:#202923;--muted:#5e6a63;--line:#d9e2dc;--bg:#f5f7f5;--white:#fff;--red:#a62d2d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.55}
header{background:var(--green);color:#fff;padding:20px 16px 18px}header .wrap,main{max-width:760px;margin:auto}h1{font-size:1.35rem;margin:0 0 4px}header p{margin:0;font-size:.92rem;opacity:.92}
main{padding:16px;display:grid;gap:14px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px #193c2610}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:135px}label{display:block;font-size:.9rem;font-weight:650;margin-bottom:6px}select,input[type=file]{width:100%;padding:11px;border:1px solid #b9c8bf;border-radius:10px;background:#fff;font:inherit}
button{font:inherit;font-weight:650;border:0;border-radius:11px;padding:12px 15px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);color:#fff}.secondary{background:var(--pale);color:var(--green);border:1px solid #c8ded0}.quiet{background:#fff;border:1px solid var(--line);color:var(--ink)}.small{font-size:.88rem;padding:9px 11px}
.muted{color:var(--muted);font-size:.9rem}.notice{background:#fff8e7;border:1px solid #efdfb4;padding:11px 12px;border-radius:11px;font-size:.88rem}
.progress{height:7px;background:#e6ece8;border-radius:20px;overflow:hidden;margin:10px 0 15px}.progress div{height:100%;width:0;background:var(--green);transition:width .2s}
.qmeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.88rem}.qtext{font-size:1.12rem;font-weight:700;margin:14px 0;white-space:pre-line}.choices{display:grid;gap:9px}.choice{text-align:left;width:100%;background:#fff;border:1px solid #cbd6cf;color:var(--ink);display:flex;gap:10px;align-items:flex-start}.letter{display:inline-grid;place-items:center;min-width:27px;height:27px;border-radius:50%;background:#edf2ee;color:var(--green);font-weight:750}.choice.correct{border-color:#3b8a60;background:#eff9f2}.choice.wrong{border-color:#bd5656;background:#fff2f2}.feedback{margin-top:14px;padding:13px;border-radius:12px;background:#f0f5f1}.feedback.good{border:1px solid #b7d8c1}.feedback.bad{border:1px solid #e4bcbc}.feedback strong{display:block;margin-bottom:4px}.hidden{display:none!important}.score{font-size:2rem;font-weight:800;color:var(--green)}.report-area{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.report-btn{width:100%;background:#fff8e7;color:#72551a;border:1px solid #ead9a5}.foot{font-size:.8rem;color:var(--muted);text-align:center;padding:4px 0 18px}
@media(min-width:600px){main{padding:22px}.card{padding:20px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>毒劇物 試験練習</h1><p>農業用品目の学習用・ログイン不要の試作版</p></div></header>
<main>
  <section class="card">
    <h2 style="font-size:1.05rem;margin:0 0 12px">出題設定</h2>
    <div class="row">
      <div><label for="category">分野</label><select id="category"><option value="all">すべての分野</option></select></div>
      <div><label for="count">出題数</label><select id="count"><option>5</option><option selected>10</option><option>20</option><option value="all">全問</option></select></div>
    </div>
    <div class="row" style="margin-top:13px"><button class="primary" id="start">ランダム出題を始める</button><button class="secondary" id="template">問題CSVテンプレート</button></div>
  </section>
  <section class="card">
    <h2 style="font-size:1.05rem;margin:0 0 8px">問題データの読み込み</h2>
    <p class="muted" style="margin-top:0">問題データは最初から読み込み済みです。必要な場合は、管理者が用意したCSVファイルで入れ替えられます。</p>
    <label for="csvfile">問題CSVファイル</label><input id="csvfile" type="file" accept=".csv,text/csv">
    <p id="dataStatus" class="muted" aria-live="polite">標準問題データ：80問を読み込み済みです。</p>
    <div class="notice">問題データはこのアプリに組み込まれています。CSVを読み込むと、組み込みの80問が読み込んだデータに置き換わります。</div>
  </section>
  <section class="card hidden" id="quiz">
    <div class="qmeta"><span id="position">問題 1 / 5</span><span id="categoryTag"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="qtext"></div>
    <div id="choices" class="choices"></div>
    <div class="report-area"><button id="report" class="report-btn">問題文・正答の間違いを報告</button><p class="muted" style="margin:7px 0 0">気になる点があれば、報告フォームからお知らせください。</p></div>
    <div id="feedback" class="feedback hidden" aria-live="polite"></div>
    <div class="row" style="margin-top:15px"><button id="next" class="primary" disabled>次の問題へ</button><button id="quit" class="quiet">終了する</button></div>
  </section>
  <section class="card hidden" id="result">
    <h2 style="font-size:1.15rem;margin:0 0 6px">今回の結果</h2>
    <div class="score" id="score">0 / 0</div><p id="percent" style="margin:0 0 10px"></p><p id="resultText" class="muted"></p>
    <button class="primary" id="again">もう一度挑戦する</button>
  </section>
</main>
<div class="foot">農業用品目・全80問収録 ・ 学習記録は保存しません</div>
<script>
const builtInQuestions = [{"number":1,"category":"毒物及び劇物に関する法規","question":"問1：以下の法の条文について、（ア）（イ）（ウ）の中に入れるべき字句の正しい組み合わせを一つ選びなさい。\n\n第1条\nこの法律は、毒物及び劇物について、保健衛生上の見地から必要な（ア）を行うことを目的とする。\n\n第2条第1項\nこの法律で「毒物」とは、別表第一に掲げる物であって、（イ）及び医薬部外品以外のものをいう。\n\n第3条第1項\n毒物又は劇物の製造業の登録を受けた者でなければ、毒物又は劇物を（ウ）の目的で製造してはならない。","A":"ア：措置／イ：医薬品／ウ：貯蔵又は販売","B":"ア：措置／イ：飲食物／ウ：販売又は授与","C":"ア：取締／イ：医薬品／ウ：販売又は授与","D":"ア：取締／イ：飲食物／ウ：貯蔵又は販売","E":"","answer":"C","explanation":""},{"number":2,"category":"毒物及び劇物に関する法規","question":"問2：特定毒物研究者に関する以下の記述のうち、正しいものを一つ選びなさい。","A":"特定毒物研究者は、特定毒物使用者に対し、特定毒物を譲り渡すことができない。","B":"特定毒物研究者は、特定毒物を学術研究以外の用途に供してはならない。","C":"特定毒物研究者は、特定毒物を使用することはできるが、製造してはならない。","D":"","E":"","answer":"B","explanation":""},{"number":3,"category":"毒物及び劇物に関する法規","question":"問3：法第3条の3に規定される、興奮・幻覚・麻酔作用を有する毒物又は劇物（これらを含有する物を含む。）として正しい組み合わせを一つ選びなさい。","A":"(a,b) メタノールを含有するシンナー／トルエンを含有する塗料","B":"(a,c) メタノールを含有するシンナー／キシレンを含有する接着剤","C":"(b,d) トルエンを含有する塗料／アニリンを含有するシーリング用充てん料","D":"(c,d) キシレンを含有する接着剤／アニリンを含有するシーリング用充てん料","E":"","answer":"A","explanation":""},{"number":4,"category":"毒物及び劇物に関する法規","question":"問4：営業の登録に関する以下の記述のうち、誤っているものを一つ選びなさい。","A":"毒物又は劇物の製造業の登録は、製造所ごとに行う。","B":"毒物又は劇物の輸入業の登録は、厚生労働大臣が行う。","C":"毒物又は劇物の販売業の登録は、6年ごとに更新を受けなければ、その効力を失う。","D":"","E":"","answer":"B","explanation":""},{"number":5,"category":"毒物及び劇物に関する法規","question":"問5：以下の省令の条文について、（a）（b）（c）の中に入れるべき字句の正しい組み合わせを一つ選びなさい。\n\n第4条の4　毒物又は劇物の製造所の設備の基準は、次のとおりとする。\n一　毒物又は劇物の製造作業を行なう場所は、次に定めるところに適合するものであること。\nイ　（a）、板張り又はこれに準ずる構造とする等、その外に毒物又は劇物が飛散し、漏れ、しみ出若しくは流れ出、又は地下にしみ込むおそれのない構造であること。\nロ　毒物又は劇物を含有する（b）、蒸気又は（c）の処理に要する設備又は器具を備えていること。","A":"a：セメント／b：汚泥／c：廃水","B":"a：セメント／b：粉じん／c：排気","C":"a：コンクリート／b：汚泥／c：排気","D":"a：コンクリート／b：粉じん／c：廃水","E":"","answer":"D","explanation":""},{"number":6,"category":"毒物及び劇物に関する法規","question":"問6：法第8条第1項に規定される毒物劇物取扱責任者となることができる者として、誤っているものを一つ選びなさい。","A":"薬剤師","B":"厚生労働省令で定める学校で、生物学に関する学課を修了した者","C":"都道府県知事が行う毒物劇物取扱者試験に合格した者","D":"","E":"","answer":"B","explanation":""},{"number":7,"category":"毒物及び劇物に関する法規","question":"問7：法第10条の規定により、毒物又は劇物の製造業者が30日以内に届け出なければならない場合の正誤の組み合わせを一つ選びなさい。\nア：製造所の名称を変更した\nイ：製造・貯蔵・運搬設備の重要な部分を変更した\nウ：登録品目以外の毒物又は劇物を製造しようとした\nエ：登録品目の製造を廃止した","A":"ア 正／イ 誤／ウ 正／エ 正","B":"ア 正／イ 正／ウ 誤／エ 正","C":"ア 正／イ 正／ウ 正／エ 誤","D":"ア 誤／イ 誤／ウ 誤／エ 正","E":"","answer":"B","explanation":""},{"number":8,"category":"毒物及び劇物に関する法規","question":"問8：以下の法の条文について、（ア）（イ）（ウ）の中に入れるべき字句の正しい組み合わせを一つ選びなさい。\n\n第12条第2項\n毒物劇物営業者は、その容器及び被包に、左に掲げる事項を表示しなければ、毒物又は劇物を販売し、又は授与してはならない。\n一　毒物又は劇物の名称\n二　毒物又は劇物の（ア）及びその（イ）\n三　厚生労働省令で定める毒物又は劇物については、それぞれ厚生労働省令で定めるその（ウ）の名称\n四　毒物又は劇物の取扱及び使用上特に必要と認めて、厚生労働省令で定める事項","A":"ア：別名／イ：性状／ウ：解毒剤","B":"ア：成分／イ：性状／ウ：中和剤","C":"ア：別名／イ：含量／ウ：中和剤","D":"ア：成分／イ：含量／ウ：解毒剤","E":"","answer":"D","explanation":""},{"number":9,"category":"毒物及び劇物に関する法規","question":"問9：毒物又は劇物の譲渡手続に関する以下の記述の正誤の組み合わせを一つ選びなさい。\nア：必要事項を記載・押印した書面に代えて電子情報処理組織を使う方法は認められない。\nイ：購入時の書面には譲受人の年齢を記載する。\nウ：譲渡手続の書面は販売・授与の日から5年間保存する。","A":"ア 正／イ 誤／ウ 誤","B":"ア 誤／イ 正／ウ 正","C":"ア 誤／イ 誤／ウ 正","D":"ア 誤／イ 正／ウ 誤","E":"","answer":"C","explanation":""},{"number":10,"category":"毒物及び劇物に関する法規","question":"問10：法第22条第1項に規定される業務上取扱者の届出が必要な事業者の正しい組み合わせを一つ選びなさい。\na：内容積1,000Lの容器を積載した大型自動車でジメチル硫酸を運送\nb：砒素化合物の毒物等を業務上取り扱う、しろあり防除事業者\nc：無機シアン化合物の毒物等を業務上取り扱う、試験検査事業者\nd：内容積100Lの容器を積載した大型自動車で四アルキル鉛製剤を運送","A":"(a,b)","B":"(a,c)","C":"(b,d)","D":"(c,d)","E":"","answer":"A","explanation":""},{"number":11,"category":"毒物及び劇物に関する法規","question":"問11：特定毒物を含有する製剤のうち、法令で着色基準が定められているものとして、誤っているものを一つ選びなさい。","A":"テトラエチルピロホスフェイト","B":"ジメチルエチルメルカプトエチルチオホスフェイト","C":"モノフルオール酢酸アミド","D":"四アルキル鉛","E":"","answer":"A","explanation":""},{"number":12,"category":"毒物及び劇物に関する法規","question":"問12：政令第40条の廃棄方法の技術上の基準について、（ア）（イ）（ウ）に入る字句の正しい組み合わせを一つ選びなさい。","A":"ア：濃縮／イ：電気分解／ウ：稀釈","B":"ア：濃縮／イ：加水分解／ウ：蒸留","C":"ア：中和／イ：電気分解／ウ：蒸留","D":"ア：中和／イ：加水分解／ウ：稀釈","E":"","answer":"D","explanation":""},{"number":13,"category":"毒物及び劇物に関する法規","question":"問13：法第17条の事故の際の措置に関する記述のうち、誤っているものを一つ選びなさい。","A":"飛散により不特定の者に健康危害のおそれがあるとき、保健所・警察署・消防機関に届け出て応急措置を講じる。","B":"毒物劇物営業者は、取扱いに係る毒物又は劇物を紛失したとき、直ちに保健所に届け出る。","C" planation":""},{"number":49,"category":"基礎化学","question":"問49：ルシャトリエの原理に関する記述として最も適当なものを一つ選びなさい。","A":"化学変化では、反応前後の物質の質量の総和は等しい。","B":"混合気体の全圧は、その各成分気体の分圧の和に等しい。","C":"同温・同圧では、どの気体も同体積中に同数の分子を含む。","D":"可逆反応が平衡状態にあるとき、濃度・圧力・温度などの条件を変えると、その変化を妨げる方向に反応が進み、新しい平衡状態になる。","E":"","answer":"D","explanation":""},{"number":50,"category":"基礎化学","question":"問50：炭化水素に関する記述のうち、誤っているものを一つ選びなさい。","A":"枝分かれのあるアルカンは、同じ炭素数の直鎖状アルカンに比べ、沸点が低い。","B":"炭化水素は無極性分子なので、極性の強い水には溶けにくい。","C":"ブタンには構造異性体が存在しない。","D":"炭素原子が環状につながった飽和炭化水素をシクロアルカンといい、炭素数5以上のものは安定である。","E":"","answer":"C","explanation":""},{"number":51,"category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法（農業用品目）","question":"問51：以下の物質を含有する製剤が毒物の指定から除外される上限濃度に関する組み合わせとして、正しいものを一つ選びなさい。","A":"2-ジフェニルアセチル-1,3-インダンジオン（別名ダイファシノン）－10％","B":"テフルトリン（原文記載の化学名）－1.5％","C":"S,S-ビス(1-メチルプロピル)=O-エチル=ホスホロジチオアート（別名カズサホス）－0.005％","D":"","E":"","answer":"B","explanation":""},{"number":52,"category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法（農業用品目）","question":"問52：以下の物質と用途に関する組み合わせのうち、正しいものを一つ選びなさい。","A":"2-クロルエチルトリメチルアンモニウムクロリド（別名クロルメコート）－農薬殺虫剤","B":"ベンフラカルブ（原文記載の化学名）－植物成長調整剤","C":"燐化亜鉛－殺鼠剤","D":"","E":"","answer":"C","explanation":""},{"number":53,"category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法（農業用品目）","question":"問53：次の物質の性状として最も適当なものを一つ選びなさい：1,1'-ジメチル-4,4'-ジピリジニウムジクロリド（別名パラコート）","A":"暗赤色の光沢のある粉末で、融点420℃。水・アルコールに不溶で、空気中で分解する。","B":"純品は無色の油状体で、市販品は通常微黄色。催涙性と強い粘膜刺激臭があり、アルコール・エーテルに可溶で金属腐食性が大きい。","C":"メルカプタン臭のある淡黄色の透明液体。沸点86～91℃。水に難溶だが有機溶媒には可溶。","D":"白色の固体で融点51～52℃。キシレン、ベンゼン、メタノール、アセトン、クロロホルムに可溶。水溶液は室温で徐々に加水分解し、アルカリ溶液中では速やかに加水分解。太陽光線には安定で、熱安定性は低い。","E":"無色の吸湿性結晶で約300℃で分解。中性・酸性下で安定、アルカリ性で不安定。水溶液中、紫外線で分解。工業品は暗褐色または暗青色の特異臭のある水溶液。","answer":"E","explanation":""},{"number":54,"category":"毒物及び劇物の性質、貯蔵、識別及び取扱方法（農業用品目）","question":"問54：次の物質の性状として最も適当なものを一つ選びなさい：ジメチル-(N-メチルカルバミルメチル)-ジチオホスフェイト（別名ジメトエート）","A":"暗赤色の光沢のある粉末で、融点420℃。水・アルコールに不溶で、空気中で分解する。","B":"純品は無色の油状体で、市販品は通常微黄色。催涙性と強い粘膜刺激臭があり、アルコール・エーテルに可溶で金属腐食性が大きい。","C":"メルカプタン臭のある淡黄色の透明液体。沸点86～91℃。水に難溶だが有機溶媒には可溶。","D":"白色の固体で融点51～52℃。キシレン、ベンゼン、メタノール、アセトン、クロロホルムに可溶。 let questions=[...builtInQuestions], session=[], idx=0, correct=0, answered=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function refreshCategories(){const sel=$("category"), old=sel.value; const cats=[...new Set(questions.map(q=>q.category||"その他"))].sort();sel.innerHTML='<option value="all">すべての分野</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");if(cats.includes(old))sel.value=old;}
function parseCSV(text){let rows=[],row=[],field="",quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field="";}else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";}else if(c!=='\r')field+=c;}}if(field.length||row.length){row.push(field);rows.push(row);}return rows;}
$("csvfile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const txt=await f.text();const rows=parseCSV(txt);if(rows.length<2)throw Error("問題データがありません");const headers=rows[0].map(x=>x.trim().toLowerCase());const required=["category","question","a","b","c","d","answer","explanation"];const missing=required.filter(h=>!headers.includes(h));if(missing.length)throw Error("必要な列がありません: "+missing.join(", "));const parsed=rows.slice(1).filter(r=>r.some(v=>v.trim()!=="")).map(r=>{let o={};headers.forEach((h,i)=>o[h]=(r[i]||"").trim());return {number:rows.indexOf(r),category:o.category||"その他",question:o.question,A:o.a,B:o.b,C:o.c,D:o.d,E:o.e||"",answer:o.answer.toUpperCase(),explanation:o.explanation};}).filter(q=>q.question&&["A","B","C","D","E"].includes(q.answer)&&q[q.answer]);if(!parsed.length)throw Error("有効な問題が見つかりません。回答欄は A / B / C / D / E で入力してください。");questions=parsed;refreshCategories();$("dataStatus").textContent=`読み込み成功：${questions.length}問`;alert(`${questions.length}問を読み込みました。`);}catch(err){alert("CSVを読み込めませんでした。\n"+err.message);}});
function start(){let pool=questions.filter(q=>$("category").value==="all"||q.category===$("category").value);if(!pool.length){alert("この分野には問題がありません。");return;}pool=[...pool].sort(()=>Math.random()-.5);const n=$("count").value==="all"?pool.length:Math.min(Number($("count").value),pool.length);session=pool.slice(0,n);idx=0;correct=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");renderQuestion();$("quiz").scrollIntoView({behavior:"smooth",block:"start"});}
function openReport(){const q=session[idx];if(!q)return;const base="https://docs.google.com/forms/d/e/1FAIpQLSekuE6i9Suda1xbo-LHRYw2bnoEYHlgXkT5z8NBsqfwNqfSTA/viewform?usp=pp_url";const params=new URLSearchParams();params.set("entry.1985070706",String(q.number||idx+1));params.set("entry.1239902156","問題文の誤り・不足");const choiceText=["A","B","C","D","E"].filter(k=>String(q[k]??"").trim()).map(k=>`${k} ${q[k]}`).join(" / ");params.set("entry.1400974285",`問題文：${q.question}\n選択肢：${choiceText||"（登録なし）"}\n登録正答：${q.answer} ${q[q.answer]||""}`);params.set("entry.1792452620","");window.open(base+"&"+params.toString(),"_blank","noopener");}
function renderQuestion(){answered=false;const q=session[idx];$("position").textContent=`問題 ${idx+1} / ${session.length}`;$("categoryTag").textContent=q.category;$("bar").style.width=`${idx/session.length*100}%`;$("question").textContent=q.question;$("choices").innerHTML="";$("feedback").className="feedback hidden";$("feedback").innerHTML="";$("next").disabled=true;$("next").textContent=idx===session.length-1?"結果を見る":"次の問題へ";["A","B","C","D","E"].filter(k=>String(q[k]??"").trim()!=="").forEach(k=>{const b=document.createElement("button");b.className="choice";b.dataset.key=k;b.innerHTML=`<span class="letter">${k}</span><span>${esc(q[k])}</span>`;b.addEventListener("click",()=>answer(k));$("choices").appendChild(b);});}
function answer(k){if(answered)return;answered=true;const q=session[idx],ok=k===q.answer;if(ok)correct++;[...$("choices").children].forEach(b=>{b.disabled=true;const key=b.dataset.key;if(key===q.answer)b.classList.add("correct");if(key===k&&!ok)b.classList.add("wrong");});const fb=$("feedback");fb.className="feedback "+(ok?"good":"bad");fb.innerHTML=`<strong>${ok?"正解です！":"不正解です"}</strong><div>正解：${q.answer}　${esc(q[q.answer])}</div><p style="margin:8px 0 0">${esc(q.explanation||"解説は登録されていません。")}</p>`;$("next").disabled=false;$("bar").style.width=`${(idx+1)/session.length*100}%`;}
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${correct} / ${session.length} 問`;$("percent").textContent=`正答率：${Math.round(correct/session.length*100)}%`;$("resultText").textContent="この試作版では学習履歴を保存しません。";$("result").scrollIntoView({behavior:"smooth",block:"start"});}
$("report").addEventListener("click",openReport);$("start").addEventListener("click",start);$("next").addEventListener("click",()=>{if(!answered)return;if(idx<session.length-1){idx++;renderQuestion();}else finish();});$("quit").addEventListener("click",()=>{$("quiz").classList.add("hidden");});$("again").addEventListener("click",start);
$("template").addEventListener("click",()=>{const csv='category,question,A,B,C,D,E,answer,explanation\\n毒物・劇物,ここに問題文を入力,選択肢A,選択肢B,選択肢C,選択肢D,選択肢E,A,ここに解説を入力\\n';const blob=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="毒劇物_問題テンプレート.csv";a.click();URL.revokeObjectURL(a.href);});
refreshCategories();
</script>
